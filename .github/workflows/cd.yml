name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy all services (except rl_trainer)
        run: |
          railway up --service fastapi --detach
          railway up --service celery_worker --detach
          railway up --service prefect_server --detach
          railway up --service nextjs --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # rl_trainer is intentionally excluded — it requires manual Railway deploy
      # to prevent auto-deploy from killing in-progress training jobs.
      # Deploy rl_trainer manually via: railway up --service rl_trainer
