name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Deploys backend/ — FastAPI + Celery worker run in the same container
      # via backend/start.sh. Celery worker and prefect are excluded from CD:
      # celery runs inside fastapi container; prefect is manual-only.
      # Next.js frontend deploys automatically to Vercel via git push.
      - name: Deploy FastAPI + Celery
        run: railway up --service fastapi --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
