services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: pead
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pead_trading
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pead -d pead_trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  fastapi:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pead:${DB_PASSWORD}@db:5432/pead_trading
      REDIS_URL: redis://redis:6379/0
      REDIS_BACKEND_URL: redis://redis:6379/1
      REDIS_PUB_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  celery_worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=4 --max-tasks-per-child=100
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pead:${DB_PASSWORD}@db:5432/pead_trading
      REDIS_URL: redis://redis:6379/0
      REDIS_BACKEND_URL: redis://redis:6379/1
      REDIS_PUB_URL: redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  prefect_server:
    image: prefecthq/prefect:2-latest
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://pead:${DB_PASSWORD}@db:5432/prefect_meta
      PREFECT_SERVER_API_HOST: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4200:4200"
    volumes:
      - prefectdata:/root/.prefect
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4200/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nextjs:
    build: ./frontend
    command: npm run dev
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      fastapi:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  prefectdata:
